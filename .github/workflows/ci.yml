# Quy trình CI tự động kiểm tra typecheck và build production cho Frontend Admin khi deploy lên main
name: Frontend Admin CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Production Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.lingosphere.io.vn
          VITE_R2_PUBLIC_URL: https://assets.lingosphere.io.vn
