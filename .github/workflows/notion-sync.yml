name: Sync Commits to Notion Tasks
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sync_all:
        description: 'Quét và nạp toàn bộ lịch sử commit từ đầu'
        required: true
        type: boolean
        default: true

jobs:
  sync-notion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Commits to Notion
        env:
          NOTION_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB: ${{ secrets.NOTION_DATABASE_ID }}
          COMMITS: ${{ toJson(github.event.commits) }}
          EVENT_NAME: ${{ github.event_name }}
          REPO_NAME: ${{ github.repository }}
          REPO_TAG: "Frontend Admin"
        run: |
          if [ -z "$NOTION_KEY" ] || [ -z "$NOTION_DB" ]; then
            echo "Secrets NOTION_API_KEY or NOTION_DATABASE_ID not set, skipping sync."
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "=== RUNNING FULL HISTORICAL COMMIT SYNC ==="
            git log --no-merges --pretty=format:"%H|%ad|%s" --date=short --reverse | while IFS='|' read -r HASH DATE MESSAGE; do
              if [ -n "$MESSAGE" ]; then
                URL="https://github.com/${REPO_NAME}/commit/${HASH}"
                echo "Syncing commit: $MESSAGE ($DATE) -> $URL"
                curl -s -X POST 'https://api.notion.com/v1/pages' \
                  -H "Authorization: Bearer $NOTION_KEY" \
                  -H "Content-Type: application/json" \
                  -H "Notion-Version: 2022-06-28" \
                  --data "{
                    \"parent\": { \"database_id\": \"$NOTION_DB\" },
                    \"properties\": {
                      \"Tên\": {
                        \"title\": [
                          {
                            \"type\": \"text\",
                            \"text\": {
                              \"content\": \"$MESSAGE\",
                              \"link\": { \"url\": \"$URL\" }
                            }
                          }
                        ]
                      },
                      \"Dự án / Repo\": {
                        \"select\": { \"name\": \"$REPO_TAG\" }
                      },
                      \"Trạng thái\": {
                        \"status\": { \"name\": \"Hoàn tất\" }
                      },
                      \"Ngày đến hạn\": {
                        \"date\": { \"start\": \"$DATE\" }
                      },
                      \"Link Commit\": {
                        \"url\": \"$URL\"
                      }
                    }
                  }" > /dev/null
                sleep 0.1
              fi
            done
          else
            echo "=== RUNNING NEW PUSH COMMITS SYNC ==="
            TODAY=$(date +'%Y-%m-%d')
            echo "$COMMITS" | jq -c '.[]' | while read -r commit; do
              MESSAGE=$(echo "$commit" | jq -r '.message' | head -n 1)
              HASH=$(echo "$commit" | jq -r '.id')
              URL=$(echo "$commit" | jq -r '.url')
              if [ -z "$URL" ] || [ "$URL" = "null" ]; then
                URL="https://github.com/${REPO_NAME}/commit/${HASH}"
              fi
              echo "Syncing new push commit: $MESSAGE -> $URL"
              curl -s -X POST 'https://api.notion.com/v1/pages' \
                -H "Authorization: Bearer $NOTION_KEY" \
                -H "Content-Type: application/json" \
                -H "Notion-Version: 2022-06-28" \
                --data "{
                  \"parent\": { \"database_id\": \"$NOTION_DB\" },
                  \"properties\": {
                    \"Tên\": {
                      \"title\": [
                        {
                          \"type\": \"text\",
                          \"text\": {
                            \"content\": \"$MESSAGE\",
                            \"link\": { \"url\": \"$URL\" }
                          }
                        ]
                      }
                    },
                    \"Dự án / Repo\": {
                      \"select\": { \"name\": \"$REPO_TAG\" }
                    },
                    \"Trạng thái\": {
                      \"status\": { \"name\": \"Hoàn tất\" }
                    },
                    \"Ngày đến hạn\": {
                      \"date\": { \"start\": \"$TODAY\" }
                    },
                    \"Link Commit\": {
                      \"url\": \"$URL\"
                    }
                  }
                }" > /dev/null
              sleep 0.1
            done
          fi
          echo "=== SYNC COMPLETED ==="
